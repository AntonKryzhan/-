<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в админку</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 360px; margin: 0 auto; }
        h1 { font-size: 24px; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input[type="password"] { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; background: #007BFF; color: #fff; border: none; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background: #0056b3; }
        .error { color: #dc3545; margin-bottom: 15px; text-align: center; }
        .back-link { margin-top: 15px; text-align: center; }
        .back-link a { font-size: 14px; color: #007BFF; text-decoration: none; }
        .back-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Вход в админку</h1>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="post" action="{{ url_for('admin') }}" autocomplete="new-password">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="password">Пароль администратора:</label>
                <input type="password" name="password" id="password" class="form-control" required autocomplete="new-password" autocapitalize="off">
            </div>
            <div style="display: none;">
                <input type="password" name="fakepassword" autocomplete="off">
            </div>
            <button type="submit">Войти</button>
        </form>
        <div class="back-link">
            <a href="{{ url_for('index') }}">Назад к бронированию</a>
        </div>
    </div>

    <script>
        document.getElementById('password').setAttribute('autocomplete', 'new-password');
        document.getElementById('password').setAttribute('autocapitalize', 'off');
    </script>
</body>
</html>
