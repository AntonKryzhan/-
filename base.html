<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Система бронирования ноутбуков{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif; background: #0d0d0d; color: #f5f5f5; }
        a { color: inherit; }
        .topbar { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 18px 24px; border-bottom: 1px solid #222; background: #111; }
        .brand { font-size: 18px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
        .topbar-links { display: flex; gap: 12px; flex-wrap: wrap; }
        .topbar-links a { text-decoration: none; padding: 10px 14px; border: 1px solid #333; background: #161616; color: #ddd; }
        .topbar-links a:hover { background: #1e1e1e; color: #fff; }
        .container { max-width: 1100px; margin: 0 auto; padding: 32px 20px 48px; }
        .page-card { background: #111; border: 1px solid #262626; padding: 28px; }
        .page-title { margin: 0 0 10px; font-size: 28px; letter-spacing: 1px; }
        .page-subtitle { margin: 0 0 28px; color: #a0a0a0; line-height: 1.6; }
        .flash-list { display: grid; gap: 10px; margin-bottom: 24px; }
        .flash { padding: 14px 16px; border: 1px solid #6a2c2c; background: #221010; color: #fff; }
        .footer { border-top: 1px solid #222; padding: 22px; text-align: center; color: #8e8e8e; font-size: 13px; }
        .btn { display: inline-block; padding: 12px 18px; border: 1px solid #444; background: #1a1a1a; color: #fff; text-decoration: none; cursor: pointer; transition: 0.2s ease; }
        .btn:hover { background: #262626; }
        .btn-primary { background: #ffffff; color: #000000; border-color: #ffffff; }
        .btn-primary:hover { background: #dddddd; }
        .btn-danger { background: #2a1212; border-color: #5a2c2c; }
        .btn-danger:hover { background: #341616; }
        input, textarea, select { width: 100%; padding: 12px 14px; border: 1px solid #333; background: #0f0f0f; color: #fff; }
        label { display: block; margin-bottom: 8px; color: #c8c8c8; font-size: 13px; letter-spacing: 0.5px; text-transform: uppercase; }
        .grid { display: grid; gap: 18px; }
        .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        @media (max-width: 768px) {
            .topbar { flex-direction: column; align-items: flex-start; }
            .grid-2 { grid-template-columns: 1fr; }
            .page-card { padding: 20px; }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="topbar">
        <div class="brand">Система бронирования ноутбуков</div>
        <nav class="topbar-links">
            <a href="{{ url_for('index') }}">Главная</a>
            <a href="{{ url_for('admin') }}">Админка</a>
        </nav>
    </header>
    <main class="container">
        {% if error %}
        <div class="flash-list">
            <div class="flash">{{ error }}</div>
        </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">Система бронирования ноутбуков</footer>
</body>
</html>
